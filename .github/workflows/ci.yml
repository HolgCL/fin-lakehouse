name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # SEC requires a descriptive contact User-Agent (docs/PROJECT_BRIEF.md §5) -- disclosure to
  # SEC by design, not a secret. No auth token or credential is involved.
  SEC_USER_AGENT: "fin-lakehouse-ci/0.1 (contact: olegkass139@gmail.com)"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy src/

      - name: Ingest KHC from SEC EDGAR
        run: make ingest

      - name: Build silver + gold (dbt build)
        run: make build

      - name: Pytest
        run: uv run pytest
