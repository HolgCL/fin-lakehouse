# dbt profile for fin-lakehouse. `dev` (local DuckDB) is the only target exercised by CI/tests.
# `prod` documents the Databricks/Delta seam from docs/PROJECT_BRIEF.md §3 — same models, no SQL
# rewrite — but is never invoked without real credentials, so it's safe to leave as a template.
fin_lakehouse:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: duckdb
      path: "../data/warehouse.duckdb"
      threads: 4

    prod:
      type: databricks
      catalog: "{{ env_var('DATABRICKS_CATALOG', 'fin_lakehouse') }}"
      schema: gold
      host: "{{ env_var('DATABRICKS_HOST', '') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH', '') }}"
      token: "{{ env_var('DATABRICKS_TOKEN', '') }}"
      threads: 4
